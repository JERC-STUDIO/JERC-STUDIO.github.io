<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERC 生存服务器 - 官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8fff9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            color: #00a05a;
        }

        .logo span {
            color: #008b4e;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .server-button {
            background: white;
            border: 2px solid #00a05a;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #00a05a;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 160, 90, 0.08);
            cursor: pointer;
        }

        .server-button:hover {
            background: #f0f9f4;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 160, 90, 0.15);
        }

        .footer {
            margin-top: 60px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 2rem;
            }

            .button-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="logo">JERC <span>生存服务器</span></div>

<div class="button-container">
    <a href="https://jerc.flarum.cloud/" class="server-button" onclick="load(this)">服务器论坛</a>
    <a href="jercmotd.html" class="server-button" onclick="load(this)">服务器状态查询</a>
    <a href="https://jerc.flarum.cloud/events" class="server-button" onclick="load(this)">服务器活动日历</a>
</div>

<div class="footer">
    © 2024-2026 JERC 生存服务器
</div>

<script>
function load(btn) {
    btn.innerText = "加载中...";
    btn.style.pointerEvents = "none";
}
</script>

</body>
</html>
